[project]
name = "interview-memory-coach"
version = "0.1.0"
description = "Local interview practice coach with spaced repetition, SQLite, ChromaDB, and Gemini support."
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.5",
  "google-genai>=1.14.0",
  "pydantic>=2.8.2",
  "pypdf>=5.0.0",
  "streamlit>=1.44.0",
  "supabase>=2.4.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]
