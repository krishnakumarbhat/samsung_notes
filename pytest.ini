[pytest]
# Only the repository-level meta-tests live here; subsystem suites are launched
# by scripts/run_tests.py with their own working directory and PYTHONPATH.
testpaths = tests
addopts = -ra
norecursedirs = .git .venv __pycache__ 02_extracted_notes_pdf 03_rtx_compression_ocr 04_learning_recall_app 05_environments_and_venvs
filterwarnings =
    ignore::DeprecationWarning